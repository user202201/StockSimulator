name: trade
on:
  schedule:
    # every 15 min, 13:00-21:00 UTC Mon-Fri (covers US market hours in both DST/standard time)
    - cron: "*/15 13-20 * * 1-5"
  workflow_dispatch:
concurrency: trade
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python bot/run.py
      - name: Commit state
        run: |
          git config user.name "trade-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/data/state.json
          git diff --cached --quiet || (git commit -m "bot: update $(date -u +%FT%TZ)" && git pull --rebase && git push)
