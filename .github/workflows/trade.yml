name: trade
on:
  schedule:
    # Watchdog only: GitHub's cron is unreliable (often hours late). Runs normally chain themselves through the
    # tick workflow (see the last step); any scheduled run that does fire also hands over to tick and so revives a broken chain.
    - cron: "*/15 12-21 * * 1-5"
  workflow_dispatch:
    inputs:
      chained:
        description: "set by the workflow itself when it re-dispatches the next quarter-hour run"
        type: boolean
        default: false
concurrency:
  group: trade
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
  models: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure data branch exists
        run: |
          git config user.name "trade-bot"; git config user.email "bot@users.noreply.github.com"
          if ! git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git checkout --orphan data
            git rm -rf . >/dev/null
            echo "# bot data (auto-generated, do not edit)" > README.md
            git add README.md && git commit -m "init data branch" && git push origin data
            git checkout -f "$GITHUB_REF_NAME"
          fi

      - uses: actions/checkout@v4
        with:
          ref: data
          path: databranch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot
        run: python bot/run.py
        env:
          STATE_PATH: databranch/state.json
          # AI providers, tried in this order if configured: custom -> Gemini -> GitHub Models
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODEL: ${{ vars.GH_MODEL }}
          ENABLE_GH_MODELS: ${{ vars.ENABLE_GH_MODELS }}
          RETRY_AI: ${{ (github.event_name == 'workflow_dispatch' && !inputs.chained) && '1' || '' }}

      - name: Commit data to data branch
        id: commit
        working-directory: databranch
        run: |
          git config user.name "trade-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "bot: $(date -u +%FT%TZ)"
            git pull --rebase origin data
            git push origin HEAD:data
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site (dashboard + latest state)
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p _site && cp -r docs/. _site/ && mkdir -p _site/data
          if [ -f databranch/state.json ]; then cp databranch/state.json _site/data/state.json; fi

      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          path: _site
      - id: deploy
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4
        continue-on-error: true            # GitHub sometimes cannot find the artifact it has just received; one retry below
      - name: Wait before retrying the deployment
        if: steps.deploy.outcome == 'failure'
        run: sleep 20
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Hand over to the clock (tick keeps the chain going, also overnight and at weekends)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            gh workflow run tick.yml --ref "$GITHUB_REF_NAME" && exit 0
            sleep 10
          done
          exit 0
