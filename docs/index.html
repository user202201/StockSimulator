<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Simulator</title>
<script src="vendor/chart.umd.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1a1d21;--mut:#6b7280;--line:#e5e7eb;--up:#0a8f4d;--down:#d33a2c;--acc:#2563eb;--hl:rgba(37,99,235,.09)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--fg:#e6e8eb;--mut:#8b95a3;--line:#262c36;--up:#3ccf80;--down:#ff6b5e;--acc:#6ea0ff;--hl:rgba(110,160,255,.12)}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--fg:#e6e8eb;--mut:#8b95a3;--line:#262c36;--up:#3ccf80;--down:#ff6b5e;--acc:#6ea0ff;--hl:rgba(110,160,255,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--line);padding:16px 12px 10px}
#nav{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-top:2px;-webkit-mask-image:linear-gradient(#000 calc(100% - 18px),transparent);mask-image:linear-gradient(#000 calc(100% - 18px),transparent)}
#nav::-webkit-scrollbar{display:none}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}::-webkit-scrollbar-thumb:hover{background:var(--mut)}::-webkit-scrollbar-track{background:transparent}
.tk{margin:0 4px 10px;font-size:12px;color:var(--mut)}.tk-line{height:18px;overflow:hidden;white-space:nowrap}
.tk-in{display:inline-block;animation:tkin .4s ease-out both}.tk-in.tk-scroll{animation:tkin .4s ease-out both,tkscroll var(--tk-dur) linear 1.2s forwards}
@keyframes tkin{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}@keyframes tkscroll{to{transform:translateX(var(--tk-shift))}}
.tk-dots{display:flex;gap:4px;margin-top:5px}.tk-dots i{width:5px;height:5px;border-radius:50%;background:var(--line);cursor:pointer}.tk-dots i.on{background:var(--acc)}
@media(prefers-reduced-motion:reduce){.tk-in,.tk-in.tk-scroll{animation:none}.tk-line{text-overflow:ellipsis}}
main{padding:16px 24px 40px;min-width:0}
h1{font-size:16px;margin:0 4px 2px}h2{font-size:14px;margin:0 0 10px;font-weight:600}h3{font-size:13px;margin:14px 0 6px;color:var(--mut);font-weight:600}
.sub{color:var(--mut);font-size:12px;margin:0 4px 12px}
.navl{font-size:11px;color:var(--mut);margin:14px 6px 4px;letter-spacing:.04em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;cursor:pointer}
.nav:hover{background:var(--bg)}.nav.on{background:var(--bg);font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
.nav .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-variant-numeric:tabular-nums;font-size:12px;font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.side-foot{position:relative;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.setbtn{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border:0;border-radius:10px;background:transparent;color:var(--fg);font:inherit;cursor:pointer;text-align:left}
.setbtn:hover,.setbtn[aria-expanded="true"]{background:var(--bg)}
.setbtn .ic{width:32px;height:32px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.setbtn .tx{flex:1;min-width:0;line-height:1.25}.setbtn .tx b{display:block;font-size:13px}.setbtn .tx span{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setbtn .chev{color:var(--mut);font-size:12px}
.pop{position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px;z-index:30;font-size:12px}
.pop[hidden]{display:none}.pop label{display:block;color:var(--mut);margin:10px 0 4px}.pop label:first-child{margin-top:0}.pop .hr{border-top:1px solid var(--line);margin:12px 0 4px}
.pop .row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:6px;color:var(--fg);cursor:pointer}.pop .row:hover{background:var(--bg)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--fg);padding:5px 4px;font:inherit;font-size:12px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.grid .card{margin:0;padding:10px 14px}.k{color:var(--mut);font-size:12px}.v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--mut)}.sm{font-size:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500;font-size:12px}
.rk2 th:nth-child(2),.rk2 td:nth-child(2){text-align:left}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}.hl td{background:var(--hl)}
.scroll{overflow-x:auto}.chart{position:relative;height:300px}.chart.s{height:240px}.chart.xs{height:200px}
.banner{padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.warn{background:#fff3cd;color:#664d03}.err{background:#fde2e0;color:#8a1c12}.info{background:var(--hl)}
.mkt{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.mk{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:150px}
.mk b{font-size:12px;color:var(--mut);font-weight:500}.mk .p{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--mut);margin-left:6px;font-weight:400}
.hold{display:inline-block;font-size:11px;font-weight:700;width:18px;height:18px;line-height:18px;text-align:center;border-radius:4px;color:#fff;margin-right:2px}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;color:#fff}.badge.BUY{background:var(--up)}.badge.SELL{background:var(--down)}
.item{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.item:hover{background:var(--bg)}.item:last-child{border-bottom:0}
.d{color:var(--mut);font-size:12px;width:92px;flex:none}.main2{flex:1;min-width:0}.res{font-weight:600;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--mut);padding:14px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:5px 12px;cursor:pointer;font:inherit}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}.two.eq{grid-template-columns:1fr 1fr}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.pc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}.pc .t{display:flex;justify-content:space-between;align-items:center}
.ins li{margin:6px 0}.ins{margin:0;padding-left:18px}
.verdict{list-style:none;margin:0;padding:0}.verdict li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}.verdict li:last-child{border:0}.verdict i{font-style:normal;flex:none}
details{border-bottom:1px solid var(--line);padding:8px 2px}details summary{cursor:pointer}details ul{margin:8px 0 2px}
.chk{list-style:none;margin:0;padding:0}.chk li{padding:4px 0;display:flex;gap:8px}.chk i{font-style:normal;flex:none;width:18px}
.mx td,.mx th{text-align:center}.mx td:first-child,.mx th:first-child{text-align:left}
.q{border-radius:6px;padding:2px 6px;font-weight:600}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);padding:0;width:min(560px,calc(100vw - 32px));max-height:86vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.dh button{border:0;background:none;color:var(--mut);font-size:16px;cursor:pointer}
#db{padding:12px 16px 16px}.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px}.kv span{color:var(--mut)}.big{font-size:15px;font-weight:600}
@media(max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}aside{display:block;position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);min-width:0}#nav{overflow-x:auto;overflow-y:visible}.pop{bottom:auto;top:calc(100% + 6px)}
 #nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.navl{display:none}.nav{flex:none;border:1px solid var(--line)}
 main{padding:12px}.two,.two.eq{grid-template-columns:1fr}}
.toast{position:fixed;right:16px;bottom:16px;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:50;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}.toast.on{opacity:1;transform:none}
</style>
</head>
<body>
<div class="app">
<aside>
  <h1 id="ttl"></h1><div class="sub" id="upd"></div>
  <nav id="nav"></nav>
  <div class="side-foot">
    <div id="pop" class="pop" role="dialog" hidden></div>
    <button id="setbtn" class="setbtn" aria-haspopup="true" aria-expanded="false"></button>
  </div>
</aside>
<main><div id="mkt" class="mkt"></div><div id="banner"></div><section id="page"></section></main>
</div>
<div id="toast" class="toast"></div>
<dialog id="dlg"><div class="dh"><b id="dt"></b><button id="dx" aria-label="close">✕</button></div><div id="db"></div></dialog>
<script>
/* ============================ i18n ============================ */
const D={};const add=(k,zh,en,fr)=>{D[k]=[zh,en,fr]};
const LIDX={zh:0,en:1,fr:2},LOC={zh:'zh-CN',en:'en-US',fr:'fr-FR'};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let LANG=store.get('lang');if(!LANG||!LIDX.hasOwnProperty(LANG)){const n=(navigator.language||'en').slice(0,2);LANG=LIDX.hasOwnProperty(n)?n:'en'}
let THEME=store.get('theme')||'auto',TZM=store.get('tz')||'et';
window.__missing=new Set();
function fill(s,a){return s.replace(/\{(\w+)\}/g,(m,k)=>a&&a[k]!==undefined?T(a[k]):m)}
function t(k,a){const e=D[k];if(!e){window.__missing.add(k);return k}return fill(e[LIDX[LANG]]??e[1],a)}
function T(x){ // data text: string | {k,a} template | {zh,en,fr}
  if(x==null)return '';if(typeof x==='number')return String(x);if(typeof x==='string')return x;
  if(x.k)return t(x.k,x.a);return x[LANG]||x.en||x.zh||x.fr||Object.values(x)[0]||''}

add('title','📈 美股模拟交易','📈 US Stock Simulator','📈 Simulateur boursier US');
add('init','初始资金','Initial capital','Capital initial');
add('updated','最后更新','Last update','Dernière mise à jour');
add('ai','AI','AI','IA');add('ai.ok','AI 最近成功','AI last success','Dernier succès IA');add('ai.none','未配置','not configured','non configurée');add('ai.demo','演示模式','demo mode','mode démo');
add('loading','加载中…','Loading…','Chargement…');add('load.fail','加载失败：','Failed to load: ','Échec du chargement : ');
add('nav.overview','🏠 总览与排名','🏠 Overview & ranking','🏠 Aperçu et classement');
add('nav.compare','🔍 决策对比与分析','🔍 Compare & analysis','🔍 Comparaison et analyse');
add('nav.traders','虚拟交易员','Virtual traders','Traders virtuels');add('nav.controls','对照组','Control group','Groupe témoin');
add('set.title','设置','Settings','Paramètres');add('set.lang','语言 / Language','Language / 语言','Langue / Language');
add('set.theme','主题','Theme','Thème');add('theme.auto','自动','Auto','Auto');add('theme.light','浅色','Light','Clair');add('theme.dark','深色','Dark','Sombre');
add('set.tz','时间显示','Time display','Affichage de l\'heure');add('tz.et','美东','US Eastern','New York');add('tz.local','本地','Local','Local');
add('tz.note.et','所有时间为美东时间（ET）','All times are US Eastern (ET)','Toutes les heures sont à l\'heure de New York (ET)');
add('tz.note.local','所有时间为你的本地时间','All times are in your local time','Toutes les heures sont à votre heure locale');
/* accounts */
const AC={
rule_long:{n:['A 趋势规则','A Trend rules','A Règles tendance'],s:['规则 · 中线趋势','Rules · swing trend','Règles · tendance moyen terme'],f:['每 15 分钟检查，持有数天到数周','Checked every 15 min, holds days to weeks','Vérifié toutes les 15 min, détient jours à semaines'],
 d:['完全按预设条件买卖，没有 AI。典型的趋势跟随者：不预测，只跟随；强势股才买，趋势没坏就一直拿（让利润奔跑），趋势坏了或回撤超过容忍度才走（截断亏损）。预期画像：胜率不高（约 40%），靠少数大赢家赚钱，持有数周。','No AI, purely preset rules. A classic trend follower: it does not predict, it follows; buys only strength, holds while the trend is intact (let profits run) and leaves when the trend breaks or the pullback exceeds its tolerance (cut losses). Expected profile: modest win rate (~40%), a few big winners carry the result, holds for weeks.','Sans IA, règles prédéfinies. Suiveur de tendance classique : ne prédit pas, suit ; n\'achète que la force, garde tant que la tendance tient (laisser courir les gains) et sort quand elle casse ou que le repli dépasse sa tolérance. Profil attendu : taux de réussite modeste (~40 %), quelques gros gagnants font le résultat, détention de plusieurs semaines.'],
 r:[['买入（只在 15:45 收盘前确认）：现价>50日均线，20日均线>50日均线，20日动量>0，RSI<75 或接近 60 日新高（强势突破不受 RSI 限制），且 SPY 在 200 日均线之上','Buy (confirmed only near the close, 15:45): price > 50-day avg, 20-day avg > 50-day avg, 20-day momentum > 0, RSI < 75 or within 2% of the 60-day high (breakouts are exempt), and SPY above its 200-day avg','Achat (confirmé seulement près de la clôture, 15 h 45) : prix > moy. 50 j, moy. 20 j > moy. 50 j, momentum 20 j > 0, RSI < 75 ou à moins de 2 % du plus haut 60 j, et SPY au-dessus de sa moy. 200 j'],
    ['最多同时持有 6 只，按 60 日动量排序选股；仓位按波动率调整（波动越大买得越少，每只 10%–30%），总仓位最多 95%','Max 6 positions, ranked by 60-day momentum; sizes are volatility-adjusted (the more volatile, the smaller; 10%–30% each), total exposure up to 95%','6 positions max, classées par momentum 60 j ; tailles ajustées à la volatilité (plus volatile = plus petite ; 10–30 % chacune), exposition totale jusqu\'à 95 %'],
    ['卖出：从最高点回撤（按个股波动调整，约 7%–15%）/ 跌破 50 日均线 2% / 硬止损（回撤线再低 2%，从成本算）；除硬止损外只在收盘前确认后执行，不被盘中噪音洗出去','Sell: drop from peak (volatility-based, about 7%–15%) / 2% below the 50-day avg / hard stop (trail + 2% below cost). Except the hard stop, exits are confirmed only near the close, so intraday noise cannot shake it out','Vente : repli depuis le pic (selon la volatilité, 7–15 %) / 2 % sous la moy. 50 j / stop strict (repli + 2 % sous le coût). Hors stop strict, confirmé seulement près de la clôture'],
    ['同一天买入的股票当天不卖；卖出后 3 天内不再买回','No same-day sell after buying; no re-buy within 3 days of a sale','Pas de vente le jour de l\'achat ; pas de rachat dans les 3 jours suivant une vente']]},
rule_short:{n:['B 日内规则','B Short-term rules','B Règles court terme'],s:['规则 · 短线','Rules · short-term','Règles · court terme'],f:['每 15 分钟检查，一天可多次交易，持仓数天，不强制清仓','Checked every 15 min, several trades a day, holds a few days, no forced flattening','Vérifié toutes les 15 min, plusieurs opérations par jour, détention de quelques jours, pas de liquidation forcée'],
 d:['完全按预设条件做短线，没有 AI。和 A 同属顺势，但看的是短期趋势（站上并向上的 20 日均线），挑股票按“今天的异动幅度”排序，不看 A 那样的 60 日长期动量，所以不会和 A 买同一批；节奏更快：目标更小、周转更快，靠一次次小赢累积，求稳。没有合适机会时可以观望，但不会长期空仓；不会每天清仓，持仓可以过夜。','Short-term trading on preset rules, no AI. It also follows the trend, but on a short horizon (above a rising 20-day average) and ranks candidates by how unusual today\'s move is, not by A\'s 60-day momentum, so it does not simply buy A\'s stocks. Faster pace: smaller targets, quicker turnover, small wins accumulate for steadiness. It may stand aside when nothing fits, but not for long; no daily flatten, positions may stay overnight.','Court terme selon des règles prédéfinies, sans IA. Suit aussi la tendance, mais à court horizon (au-dessus d\'une moyenne 20 j en hausse) et classe les candidats selon le caractère inhabituel du mouvement du jour, pas selon le momentum 60 j de A : elle n\'achète donc pas simplement les actions de A. Rythme plus rapide : objectifs plus petits, rotation plus rapide. Peut rester à l\'écart, mais pas longtemps ; pas de liquidation quotidienne.'],
 r:[['买入：10:00–15:30，SPY 在 200 日线之上且当日跌幅不超过 1.5%、VIX 没有飙升（不低于 28 或单日涨超 15% 时不开新仓），短期上升趋势的股票（现价>20日均线且20日均线比5天前更高）满足其一：①较开盘回落到按波动率定的幅度（约 0.8%–2%，低吸）；②较开盘上涨超过该幅度（不超过 6%）且处在当日区间上沿（顺势追强）；同时满足的按当日异动幅度（相对日波动）从大到小选','Buy: 10:00–15:30, SPY above its 200-day avg, not down more than 1.5% today and VIX not spiking (no new entries when VIX is 28+ or jumps 15%+ in a day); a stock in a short-term uptrend (price > 20-day avg and the 20-day avg higher than 5 days ago) meeting one of: (1) down from the open by a volatility-based amount (about 0.8%–2%: buy the dip); (2) up from the open by more than that (max 6%) and near the top of today\'s range (momentum continuation). Several qualifying: biggest move relative to daily volatility first','Achat : 10:00–15:30, SPY au-dessus de sa moy. 200 j, pas en baisse de plus de 1,5 % et VIX sans flambée (pas de nouvelle entrée si VIX ≥ 28 ou +15 % en un jour) ; action en tendance haussière courte (prix > moy. 20 j, elle-même plus haute qu\'il y a 5 jours) remplissant l\'une des conditions : (1) repli depuis l\'ouverture lié à la volatilité (≈0,8–2 % : repli) ; (2) hausse supérieure (max 6 %) près du plus haut du jour (poursuite). Si plusieurs : le plus grand mouvement relatif à la volatilité d\'abord'],
    ['最多同时持有 6 只，仓位按波动率调整（每只 8%–25%），总仓位最多 95%，每只股票每天最多买一次','Max 6 positions, volatility-adjusted sizes (8%–25% each), total exposure up to 95%, one buy per stock per day','6 positions max, tailles ajustées à la volatilité (8–25 % chacune), exposition totale jusqu\'à 95 %, un achat par action et par jour'],
    ['卖出：止盈 0.8 倍日波动（1%–3%，小赢就走）/ 止损 1.0 倍日波动（1%–3.5%）/ 收盘前确认跌破 20 日线 1% / 持有满 7 天（约 5 个交易日）后收盘前换仓；不再每天清仓，盈亏都可以过夜','Sell: take profit at 0.8x daily volatility (1%–3%: small wins) / stop at 1.0x daily volatility (1%–3.5%) / 1% below the 20-day avg confirmed near the close / rotate after 7 days (about 5 trading days); no daily flatten, positions may stay overnight either way','Vente : profit à 0,8 x la volatilité (1–3 % : petits gains) / stop à 1,0 x la volatilité (1–3,5 %) / 1 % sous la moy. 20 j confirmé près de la clôture / rotation après 7 jours (≈5 séances) ; pas de liquidation quotidienne']]},
ai_long:{n:['C AI 稳健','C AI Swing','C IA Swing'],s:['AI + 新闻 · 中线','AI + news · swing','IA + actualités · moyen terme'],f:['每天 1 次（美东 10:30），持有数天到数周','Once a day (10:30 ET), holds days to weeks','Une fois par jour (10:30 ET), détient jours à semaines'],
 d:['「波段投资者」：每天一次读取日线行情指标、大盘环境和最新新闻。先判断整体趋势，趋势向上就重仓（约 90%），只留少量现金（约 10%）补仓或应急；主要依据趋势买入，持有数天到数周，趋势没坏就拿着。','"Swing investor": once a day it reads daily-bar indicators, the market regime and the latest news. It judges the overall trend first; when the trend is up it is heavily invested (about 90%) and keeps only a small cash reserve (about 10%) for adding and emergencies; it buys mainly on trend, holds for days to weeks and keeps positions while the trend holds.','« Investisseur swing » : une fois par jour il lit les indicateurs journaliers, le régime de marché et l\'actualité. Il juge d\'abord la tendance globale ; quand elle est haussière il est fortement investi (≈90 %) et ne garde qu\'une petite réserve (≈10 %) pour renforcer ou faire face aux imprévus ; il achète surtout sur la tendance et garde tant qu\'elle tient.'],
 r:[['AI 自主决策，必须引用新闻编号，买入前必须先写看多和看空理由','The AI decides freely, must cite news ids and must write a bull and a bear case before buying','L\'IA décide librement, doit citer des identifiants d\'actualité et écrire un argument haussier et un baissier avant d\'acheter'],
    ['代码只保留基本风控：买入后至少持有 2 天，亏损 10% 强制止损；不限制持仓只数、选股和单只仓位（可以集中持有一只，也可以分散）','Code keeps only basic risk control: 2-day minimum hold and a forced -10% stop. No limit on the number of positions, on stock choice or on position size (it may concentrate in one stock or diversify)','Le code ne garde que le contrôle du risque de base : détention min. 2 jours et stop forcé -10 %. Pas de limite de positions, de choix de titres ni de taille de position (peut se concentrer sur une action ou se diversifier)'],
    ['资金使用（软性要求，不强制）：趋势向上时约 90% 投入、约 10% 现金（用于回调补仓和应急）；现金超过 20% 时 AI 必须说明理由（例如大盘趋势走坏）','Capital use (soft guidance, not enforced): with the trend up, about 90% invested and about 10% cash (for adding on pullbacks and emergencies); with more than 20% cash the AI must explain why (e.g. a broken market trend)','Usage du capital (indication, non imposée) : tendance haussière = ≈90 % investi et ≈10 % de liquidités (renforcer sur repli, imprévus) ; au-delà de 20 % de liquidités l\'IA doit s\'expliquer (ex. tendance de marché dégradée)']]},
ai_short:{n:['D AI 短线','D AI Short-term','D IA Court terme'],s:['AI + 新闻 · 短线','AI + news · short-term','IA + actualités · court terme'],f:['每天 5 次（美东 10:00 / 11:30 / 13:00 / 14:30 / 15:30 收盘复盘），可隔夜持有','5 times a day (10:00 / 11:30 / 13:00 / 14:30 / closing review 15:30 ET), may hold overnight','5 fois par jour (10:00 / 11:30 / 13:00 / 14:30 / revue de clôture 15:30 ET), peut garder la nuit'],
 d:['一天内多次复盘的短线交易员：看当天的日内信号（较开盘涨跌、当日区间位置、最近一小时走势）加最新新闻做交易。预期画像：目标约 +1%–3%，亏损约 -1.5% 就走（代码硬止损 -3%），持有数小时到几天，仓位约 50%–90%；15:30 的收盘复盘由 AI 决定每个仓位留过夜还是卖出，也可以根据当天新闻在收盘前追加买入。','An active short-term trader reviewed several times a day: trades on today\'s intraday signals (move vs the open, position in today\'s range, last-hour change) plus fresh news. Expected profile: targets about +1%–3%, cuts losses around -1.5% (code hard stop -3%), holds hours to a few days, about 50%–90% invested; at the 15:30 closing review the AI decides for each position whether to carry it overnight or sell, and may also add buys before the close on the day\'s news.','Trader court terme revu plusieurs fois par jour : s\'appuie sur les signaux intrajournaliers (variation vs ouverture, position dans la fourchette du jour, dernière heure) et l\'actualité récente. Profil attendu : objectifs ≈ +1 à 3 %, coupe les pertes vers -1,5 % (stop strict -3 %), détention de quelques heures à quelques jours, ≈ 50 à 90 % investi ; à la revue de 15:30 l\'IA décide pour chaque position de la garder la nuit ou de vendre, et peut aussi acheter avant la clôture.'],
 r:[['AI 自主决策，必须引用新闻编号，买入前必须先写看多和看空理由','The AI decides freely, must cite news ids and must write a bull and a bear case before buying','L\'IA décide librement, doit citer des identifiants d\'actualité et écrire un argument haussier et un baissier avant d\'acheter'],
    ['代码只保留基本风控：亏损 3% 强制止损，15:45 后不开新仓；不限制持仓只数、选股和单只仓位（可以集中持有一只，也可以分散），按操盘手惯例自行保留一定现金','Code keeps only basic risk control: forced -3% stop, no new buys after 15:45. No limit on the number of positions, stock choice or position size (it may concentrate or diversify); keeps a cash reserve as a normal trader would','Le code ne garde que le contrôle du risque de base : stop forcé -3 %, pas d\'achat après 15:45. Pas de limite de positions, de choix de titres ni de taille de position (concentration ou diversification) ; garde une réserve de liquidités comme un trader normal']]},
ai_hedge:{n:['F AI 对冲','F AI Hedged','F IA Couverture'],s:['AI + 新闻 · 对冲短线','AI + news · hedged short-term','IA + actualités · court terme couvert'],f:['每天 4 次（美东 11:00 / 12:30 / 14:00 / 15:00），可隔夜持有','4 times a day (11:00 / 12:30 / 14:00 / 15:00 ET), may hold overnight','4 fois par jour (11:00 / 12:30 / 14:00 / 15:00 ET), peut garder la nuit'],
 d:['对冲短线交易员：和 D 一样做日内短线，但多了对冲工具——可以买反向 ETF（SH 做空标普 500、PSQ 做空纳指 100，各 -1 倍）和防御资产（黄金 GLD、必需消费品 XLP、公用事业 XLU），也可以持现金。先判断方向：上涨时拿股票，转跌或避险时转到反向 ETF、防御资产或现金，趋势转向就调头，小赢就跑、亏了快砍。不能直接做空股票、不能加杠杆。F 从 2026-11-16（周一）开始，对比时请只看同期成绩。','A hedged short-term trader: trades intraday like D but with hedging tools: inverse ETFs (SH = -1x S&P 500, PSQ = -1x Nasdaq-100) and defensive assets (gold GLD, consumer staples XLP, utilities XLU), or cash. It decides the direction first: stocks when the market rises, inverse ETFs, defensives or cash when it turns down or risk-off; it turns around quickly when the trend turns, takes small wins and cuts losses fast. No direct short selling and no leverage. F starts on 2026-11-16 (Monday): compare it only over the same period.','Trader court terme avec couverture : opère en intrajournalier comme D mais avec des outils de couverture : ETF inverses (SH = -1x S&P 500, PSQ = -1x Nasdaq-100) et actifs défensifs (or GLD, consommation de base XLP, services aux collectivités XLU), ou liquidités. Il décide d\'abord de la direction : actions quand le marché monte, ETF inverses, défensives ou liquidités quand il tourne ou en risk-off ; il fait demi-tour vite, prend de petits gains et coupe vite les pertes. Pas de vente à découvert directe ni d\'effet de levier. F démarre le 2026-11-16 (lundi) : ne le comparer que sur la même période.'],
 r:[['AI 自主决策，必须引用新闻编号，买入前必须先写看多和看空理由','The AI decides freely, must cite news ids and write a bull and a bear case before buying','L\'IA décide librement, doit citer des identifiants d\'actualité et écrire un argument haussier et un baissier avant d\'acheter'],
    ['可买的标的：21 只股票 + 对冲工具 SH、PSQ（反向 ETF，适合持有几小时到几天，长期持有会损耗）+ 防御资产 GLD、XLP、XLU；不能直接做空股票、不能加杠杆','Tradable: the 21 stocks + hedges SH and PSQ (inverse ETFs, for hours to a few days; they decay over long holds) + defensives GLD, XLP, XLU; no direct short selling, no leverage','Négociable : les 21 actions + couvertures SH et PSQ (ETF inverses, pour quelques heures à quelques jours ; ils se dégradent à long terme) + défensives GLD, XLP, XLU ; pas de vente à découvert directe, pas de levier'],
    ['代码只保留基本风控：亏损 3% 强制止损，15:45 后不开新仓；不限制持仓只数和单只仓位；额度紧张时 F 最先暂停','Code keeps only basic risk control: forced -3% stop, no new buys after 15:45; no limit on positions or position size; F is the first to pause when the AI quota runs low','Le code ne garde que le contrôle du risque de base : stop forcé -3 %, pas de nouvel achat après 15:45 ; pas de limite de positions ni de taille ; F est le premier à se suspendre quand le quota IA baisse']]},
ai_aggr:{n:['E AI 激进','E AI Aggressive','E IA Agressive'],s:['AI + 新闻 · 高周转','AI + news · high turnover','IA + actualités · forte rotation'],f:['每 30 分钟复盘（美东 10:15–15:15，共 11 次，与 C、D 错开以免触发限速），可隔夜持有','Every 30 min (10:15–15:15 ET, 11 reviews, offset from C and D to stay under the rate limit), may hold overnight','Toutes les 30 min (10:15–15:15 ET, 11 revues, décalées par rapport à C et D pour respecter la limite de débit), peut garder la nuit'],
 d:['从 D 克隆、更激进的版本：目标是提高资金周转率，让资金尽量一直在运转，用来测试“高周转”是否更有效率。预期画像：每 30 分钟复盘一次（11 次/天），小利 +0.5%–2% 就走，亏损约 -1% 就走，通常 85%–100% 投入，卖出款立即可用，可以卖一只马上买另一只；买卖次数、持仓只数都不设限，只受免费 AI 额度限制。','A more aggressive clone of D: the goal is a higher capital turnover, keeping the money working at all times, to test whether \'high turnover\' is more efficient. Expected profile: reviewed every 30 minutes (11 times a day), takes small profits (+0.5%–2%), cuts losses around -1%, normally 85%–100% invested, sale proceeds are usable immediately so it can sell one name and buy another at once; no limit on trades or positions except the free AI quota.','Clone plus agressif de D : l\'objectif est une rotation du capital plus élevée, l\'argent travaille en permanence, pour tester si la « forte rotation » est plus efficace. Profil attendu : revue toutes les 30 minutes (11 fois par jour), prend de petits gains (+0,5 à 2 %), coupe les pertes vers -1 %, en général 85 à 100 % investi, le produit des ventes est disponible immédiatement : vendre un titre et en acheter un autre aussitôt ; pas de limite de transactions ou de positions hormis le quota IA gratuit.'],
 r:[['AI 自主决策，必须引用新闻编号；看多/看空辩论对它是可选的（为了速度）','The AI decides freely and must cite news ids; the bull/bear debate is optional for it (for speed)','L\'IA décide librement et doit citer des identifiants d\'actualité ; le débat haussier/baissier est facultatif (pour la rapidité)'],
    ['没有持仓数量限制、没有强制止损、没有每轮买入次数限制、没有单只仓位上限；只保留：只做多、不加杠杆、不能超过可用资金','No limit on positions, no forced stop, no limit on buys per review and no per-stock cap; only: long-only, no leverage, cannot exceed available cash','Pas de limite de positions, pas de stop forcé, pas de limite d\'achats par revue, pas de plafond par action ; seulement : long uniquement, sans levier, dans la limite des liquidités disponibles'],
    ['实验设定：卖出的钱立即可以再买，也不受 PDT 限制（相当于保证金账户的日内交易条件，但不加杠杆）——这和其他账户不同，对比时请注意','Experimental setting: sale proceeds can be reused immediately and the PDT rule does not apply (like margin-account day-trading conditions, but without leverage) — this differs from the other accounts, keep it in mind when comparing','Réglage expérimental : le produit des ventes est réutilisable immédiatement et la règle PDT ne s\'applique pas (conditions d\'un compte sur marge, mais sans levier) — différent des autres comptes, à garder en tête dans les comparaisons'],
    ['每天 11 次复盘（与 C、D 的时间错开），受免费 AI 额度限制；额度用尽时自动暂停当天的复盘','11 reviews a day (offset from C and D), limited by the free AI quota; reviews pause for the day when the quota budget is used up','11 revues par jour (décalées par rapport à C et D), limitées par le quota IA gratuit ; les revues sont suspendues pour la journée quand le budget de quota est épuisé']]},
spy:{n:['SPY 买入持有','SPY buy & hold','SPY acheter-conserver'],s:['对照 · 基准','Control · benchmark','Témoin · référence'],f:['只在开局买入一次','Bought once at the start','Acheté une seule fois au départ'],d:['基准：开局全仓买入 SPY 后不再操作。','Benchmark: all-in on SPY at the start, then never touched.','Référence : tout en SPY au départ, puis plus aucune opération.'],r:[]},
equal:{n:['股票池等权持有','Equal-weight (21)','Équipondéré (21)'],s:['对照 · 基准','Control · benchmark','Témoin · référence'],f:['只在开局买入一次','Bought once at the start','Acheté une seule fois au départ'],d:['基准：开局把本金等分买入全部 21 只股票后不再操作，用来抵消“所选股票本来就是强势股”的偏差。','Benchmark: splits the capital equally across all 21 stocks at the start, then never touched. Cancels the bias of "these stocks were strong anyway".','Référence : répartit le capital à parts égales sur les 21 actions au départ, puis plus rien. Neutralise le biais « ces actions étaient déjà fortes ».'],r:[]},

/* ============================ helpers ============================ */
const $=id=>document.getElementById(id);
const TRADERS=['rule_long','rule_short','ai_long','ai_short','ai_aggr','ai_hedge'];
const COLORS={rule_long:'#2563eb',rule_short:'#06b6d4',ai_long:'#7c3aed',ai_short:'#db2777',ai_aggr:'#84cc16',ai_hedge:'#f59e0b',spy:'#8b95a3',equal:'#0d9488',random:'#d97706'};
const nf=(x,d=2)=>x.toLocaleString(LOC[LANG],{minimumFractionDigits:d,maximumFractionDigits:d});
const usd=x=>(x<0?'-':'')+'$'+nf(Math.abs(x));
const pct=(x,d=2)=>x==null||isNaN(x)?'—':(x>=0?'+':'')+nf(x*100,d)+'%';
const pct0=x=>x==null||isNaN(x)?'—':nf(x*100,0)+'%';
const cls=x=>x>=0?'up':'down',fmt=x=>x==null?'—':x;
const ETF=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York'});
const etDate=iso=>ETF.format(new Date(iso));
let TF;function mkTF(){TF=new Intl.DateTimeFormat('en-GB',{timeZone:TZM==='et'?'America/New_York':undefined,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}
const fmtT=iso=>{const p=Object.fromEntries(TF.formatToParts(new Date(iso)).map(x=>[x.type,x.value]));return `${p.month}-${p.day} ${p.hour}:${p.minute}`};
const D10=x=>x.slice(0,10);
let S,charts=[],logN=40;
const last=a=>a.equity.length?a.equity.at(-1).equity:S.initial_cash;
const ret=a=>last(a)/S.initial_cash-1;
function dayPnl(a){const today=etDate(S.updated);const b=a.equity.filter(e=>etDate(e.time)<today).at(-1);return last(a)-(b?b.equity:S.initial_cash)}
function maxdd(a){let pk=0,m=0;for(const e of a.equity){pk=Math.max(pk,e.equity);m=Math.min(m,e.equity/pk-1)}return m}
const M=sym=>(S.market||{})[sym]||{};
const px=(sym,fb)=>S.prices[sym]??fb;
const dotc=id=>`<span class="dot" style="background:${COLORS[id]||'#999'}"></span>`;
const letter=id=>`<span class="hold" style="background:${COLORS[id]}" title="${nm(id)}">${nm(id)[0]}</span>`;
const holders=sym=>TRADERS.filter(id=>S.accounts[id]&&S.accounts[id].positions[sym]).map(letter).join('');
const ranking=()=>Object.keys(S.accounts).map(id=>({id,r:ret(S.accounts[id])})).sort((a,b)=>b.r-a.r);
function spark(arr,w=84,h=24){if(!arr||arr.length<2)return'';const mn=Math.min(...arr),mx=Math.max(...arr),r=mx-mn||1;
  const pts=arr.map((v,i)=>`${(i/(arr.length-1)*w).toFixed(1)},${(h-2-(v-mn)/r*(h-4)).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${arr.at(-1)>=arr[0]?'#0a8f4d':'#d33a2c'}" stroke-width="1.5" points="${pts}"/></svg>`}
function killCharts(){charts.forEach(c=>c.destroy());charts=[]}
function chartDefaults(){const cs=getComputedStyle(document.documentElement);Chart.defaults.color=cs.getPropertyValue('--mut').trim()||'#6b7280';Chart.defaults.borderColor=cs.getPropertyValue('--line').trim()||'#e5e7eb'}
function lineChart(el,ids){chartDefaults();const base=S.accounts[ids[0]].equity;
  charts.push(new Chart($(el),{type:'line',data:{labels:base.map(e=>fmtT(e.time)),datasets:ids.map(id=>({label:nm(id),data:S.accounts[id].equity.map(e=>(e.equity/S.initial_cash-1)*100),
   borderColor:COLORS[id],borderWidth:TRADERS.includes(id)?2.4:1.4,borderDash:TRADERS.includes(id)?[]:[5,3],pointRadius:0,tension:.15}))},
   options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.y.toFixed(2)}%`}}},scales:{x:{ticks:{maxTicksLimit:8}},y:{ticks:{callback:v=>v+'%'}}}}}))}
function barChart(el,ids,vals,unit){chartDefaults();
  charts.push(new Chart($(el),{type:'bar',data:{labels:ids.map(nm),datasets:[{data:vals,backgroundColor:ids.map(i=>COLORS[i]),borderRadius:4}]},
   options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>unit==='%'?c.parsed.x.toFixed(2)+'%':usd(c.parsed.x)}}},scales:{x:{ticks:{callback:v=>unit==='%'?v+'%':'$'+v}}}}}))}
function outcome(a,tr){
  if(tr.side==='SELL')return {val:tr.detail?.ret??0,text:`${pct(tr.detail?.ret??0)} · ${usd(tr.pnl)}`,sum:t('sum.held',{d:tr.detail?.held_days??'?'})};
  const c=a.trades.find(x=>x.side==='SELL'&&x.symbol===tr.symbol&&x.id>tr.id);
  if(c){const r=c.price/tr.price-1;return {val:r,text:`${pct(r)} · ${usd(c.pnl)}`,sum:t('sum.closed')}}
  const now=px(tr.symbol,tr.price),r=now/tr.price-1;return {val:r,text:pct(r)+' · '+usd(tr.shares*(now-tr.price)),sum:t('sum.open')}}

/* ============================ stats ============================ */
const SLIP=0.0005;
function holdHours(a){const last={},hs=[];a.trades.forEach(x=>{if(x.side==='BUY')last[x.symbol]=x.time;else if(last[x.symbol]){hs.push((new Date(x.time)-new Date(last[x.symbol]))/36e5)}});return hs.length?hs.reduce((s,x)=>s+x,0)/hs.length:null}
function stats(a){
  const sells=a.trades.filter(x=>x.side==='SELL'),buys=a.trades.filter(x=>x.side==='BUY'),wins=sells.filter(x=>x.pnl>0),loss=sells.filter(x=>x.pnl<=0);
  const avg=arr=>arr.length?arr.reduce((s,x)=>s+x,0)/arr.length:null;
  const byDay={};a.equity.forEach(e=>byDay[etDate(e.time)]=e.equity);const v=Object.values(byDay),rets=[];for(let i=1;i<v.length;i++)rets.push(v[i]/v[i-1]-1);
  const mu=avg(rets),vol=rets.length>=3?Math.sqrt(rets.reduce((s,x)=>s+(x-mu)**2,0)/(rets.length-1)):null;
  const posVal=Object.entries(a.positions).reduce((s,[k,p])=>s+p.shares*px(k,p.avg_cost),0);
  return {ret:ret(a),today:dayPnl(a),dd:maxdd(a),vol,trades:a.trades.length,closed:sells.length,win:sells.length?wins.length/sells.length:null,
    avgwin:avg(wins.map(x=>x.pnl)),avgloss:avg(loss.map(x=>x.pnl)),hold:avg(sells.map(x=>x.detail?.held_days).filter(x=>x!=null)),
    turn:buys.reduce((s,x)=>s+x.shares*x.price,0)/S.initial_cash,tpd:Object.keys(byDay).length?a.trades.length/Object.keys(byDay).length:null,net:sells.length?sells.reduce((s,x)=>s+(x.pnl||0),0)/sells.length:null,hours:holdHours(a),cost:(a.fees_paid||0)+SLIP*a.trades.reduce((s,x)=>s+x.shares*x.price,0),exp:last(a)?posVal/last(a):0,fees:a.fees_paid||0,days:Object.keys(byDay).length}}
const heldSet=a=>new Set([...Object.keys(a.positions),...a.pending.filter(o=>o.side==='BUY').map(o=>o.symbol)]);
function jaccard(a,b){const A=heldSet(a),B=heldSet(b);const u=new Set([...A,...B]);if(!u.size)return null;let i=0;A.forEach(x=>{if(B.has(x))i++});return i/u.size}
function tradingDays(){const s=new Set();Object.values(S.accounts).forEach(a=>a.equity.forEach(e=>s.add(etDate(e.time))));return s.size}
function verdicts(){
  const out=[],R=ranking(),A=id=>S.accounts[id],tr=TRADERS.filter(i=>A(i)),r=id=>ret(A(id)),avg=ids=>ids.length?ids.reduce((s,i)=>s+r(i),0)/ids.length:0;
  out.push(t('v.lead',{a:nm(R[0].id),ra:pct(R[0].r),b:nm(R.at(-1).id),rb:pct(R.at(-1).r)}));

/* ============================ detail popup ============================ */
function detail(a,x,pending){
  const d=x.detail||{},buy=x.side==='BUY',now=px(x.symbol,x.price||x.decision_price),li=(c,y,n)=>`<li><i>${c.ok?y:n}</i><span>${T(c.text)}</span></li>`;
  $('dt').textContent=`${nm(a.kind)} · ${pending?t('d.pendtitle'):''}${buy?t('side.buy'):t('side.sell')} ${x.symbol}`;
  let h=`<div class="big ${buy?'up':'down'}">${T(x.reason)}</div><div class="kv" style="margin-top:8px">`;
  if(pending)h+=`<span>${t('d.status')}</span><div>${t('d.statusv')}</div><span>${t('d.decision')}</span><div>${fmtT(x.decided_at)}, ${t('d.dpx',{p:usd(x.decision_price)})}</div><span>${t('d.now')}</span><div>${usd(now)} (${t('d.vsd',{x:pct(now/x.decision_price-1)})})</div><span>${t('d.plan')}</span><div>${x.dollars?usd(x.dollars):t('pd.all')}</div>`;
  else{h+=`<span>${t('d.fill')}</span><div>${t('d.shares',{n:x.shares,p:usd(x.price),v:usd(x.shares*x.price)})}</div>`;
    if(d.decided_at)h+=`<span>${t('d.d2f')}</span><div>${t('d.d2fv',{t1:fmtT(d.decided_at),p1:usd(d.decision_price),t2:fmtT(x.time),p2:usd(x.price)})}<br><small class="mut">${t('d.slip')}</small></div>`;
    if(!buy&&x.fee!=null)h+=`<span>${t('d.fee')}</span><div>${t('d.feev',{v:usd(x.fee)})}</div>`;
    if(buy&&d.weight)h+=`<span>${t('d.weight')}</span><div>${t('d.weightv',{w:pct0(d.weight),e:usd(d.equity)})}</div><span>${t('d.cashchg')}</span><div>${usd(d.cash_before)} → ${usd(d.cash_after)}</div>`;
    if(buy&&d.spy_px&&px('SPY'))h+=`<span>${t('d.vsmkt')}</span><div>${t('d.vsmktv',{a:pct(now/x.price-1),b:pct(px('SPY')/d.spy_px-1)})}</div>`;
    if(!buy&&d.avg_cost)h+=`<span>${t('d.cost')}</span><div>${usd(d.avg_cost)}</div><span>${t('d.peak')}</span><div>${usd(d.peak)}</div><span>${t('d.held')}</span><div>${t('d.heldv',{d:d.held_days,t:fmtT(d.entry)})}</div><span>${t('d.settle')}</span><div>${t('d.settlev')}</div>`}
  h+='</div>';
  if(d.ai)h+=`<h3>${t('d.aitit')}</h3><div class="kv"><span>${t('d.model')}</span><div>${d.ai.provider} / ${d.ai.model}</div><span>${t('d.conf')}</span><div>${pct0(d.ai.confidence)}</div><span>${t('d.view')}</span><div>${T(d.ai.summary)||'—'}</div><span>${t('d.round')}</span><div>${d.ai.round}</div></div>`;
  if(d.ai&&(d.ai.bull||d.ai.bear))h+=`<h3>${t('d.debate')}</h3><div class="kv"><span>${t('d.bull')}</span><div>${T(d.ai.bull)||'—'}</div><span>${t('d.bear')}</span><div>${T(d.ai.bear)||'—'}</div></div>`;
  const rv=!pending&&!buy&&S.learn&&S.learn.reviews&&S.learn.reviews[a.kind+':'+x.id];
  if(rv)h+=`<h3>${t('d.review')}</h3><div>${verdictBadge(rv.verdict)}</div><div style="margin-top:4px">${T(rv.review)}</div><div class="sm mut" style="margin-top:4px">💡 ${T(rv.takeaway)}</div>`;
  if(d.checks)h+=`<h3>${buy?t('d.buybasis'):t('d.sellbasis')}</h3><ul class="chk">${d.checks.map(c=>li(c,buy?'✅':'🔔',buy?'❌':'·')).join('')}</ul>`;
  if(d.news&&d.news.length)h+=`<h3>${t('d.news')}</h3><ul class="chk">${d.news.map(n=>`<li><i>📰</i><span>[${n.id}] <b>${n.sym}</b> · ${n.src} · ${t('d.ago',{h:n.age_h})}<br>${n.title}</span></li>`).join('')}</ul>`;
  else if(d.ai)h+=`<h3>${t('d.news')}</h3><div class="sm mut">${t('d.nonews')}</div>`;
  if(d.ind){const i=d.ind;h+=`<h3>${t('d.ind')} <a href="#/learn/sma" onclick="$('dlg').close()" title="${t('nav.learn')}">ⓘ</a></h3><div class="kv"><span>${t('d.price')}</span><div>${usd(i.price)}</div><span>SMA20 / SMA50</span><div>${fmt(i.sma20?.toFixed(2))} / ${fmt(i.sma50?.toFixed(2))}</div><span>RSI(14)</span><div>${fmt(i.rsi?.toFixed(0))}</div><span>${t('d.m2')}</span><div>${i.mom20==null?'—':pct(i.mom20)} / ${i.mom60==null?'—':pct(i.mom60)}</div></div>`}
  if(!pending){const o=outcome(a,x);h+=`<h3>${t('d.result')}</h3><div class="big ${cls(o.val)}">${o.text}　<span class="sm mut">${o.sum}</span></div>`}
  $('db').innerHTML=h;$('dlg').showModal()}


/* ============================ learn (glossary) ============================ */
const GL=[
['sma',['均线（SMA）','Moving average (SMA)','Moyenne mobile (SMA)'],['过去 N 天收盘价的平均值，用来抹平短期波动、看清趋势。价格在均线之上通常说明走势偏强，反之偏弱。本项目用到 20 日、50 日、200 日均线。','The average closing price over the last N days. It smooths short-term noise to reveal the trend. Price above its average usually means strength, below means weakness. This project uses the 20-, 50- and 200-day averages.','La moyenne des cours de clôture sur N jours. Elle lisse le bruit de court terme pour révéler la tendance. Un prix au-dessus de sa moyenne signale en général de la force. Ce projet utilise les moyennes 20, 50 et 200 jours.']],
['rsi',['RSI 相对强弱指数','RSI (Relative Strength Index)','RSI (indice de force relative)'],['0 到 100 的数字，衡量最近上涨和下跌的力度对比。常见看法：高于 70 可能“涨过头”，低于 30 可能“跌过头”。本项目的趋势规则不会在 RSI ≥ 75 时追买。','A number from 0 to 100 comparing recent gains with recent losses. Common reading: above 70 may be "overbought", below 30 "oversold". The trend rules here refuse to buy when RSI ≥ 75.','Un nombre de 0 à 100 comparant les gains et les pertes récents. Lecture courante : au-dessus de 70, « suracheté », sous 30, « survendu ». Les règles de tendance n\'achètent pas quand le RSI ≥ 75.']],
['momentum',['动量','Momentum','Momentum'],['一只股票过去 N 天的涨跌幅。“强者恒强”是常见假设：最近涨得多的，短期内更可能继续强。本项目用 20 日和 60 日动量给股票排名。','A stock\'s change over the past N days. The common assumption is "winners keep winning" in the short run. This project ranks stocks by 20- and 60-day momentum.','La variation d\'une action sur N jours. Hypothèse courante : « les gagnants continuent de gagner » à court terme. Ce projet classe les actions par momentum 20 et 60 jours.']],
['drawdown',['回撤 / 最大回撤','Drawdown / max drawdown','Repli / repli maximal'],['从资产的历史最高点到之后最低点的跌幅，衡量“最难受的时候亏了多少”。收益相同时，回撤越小越好。','The fall from an account\'s previous peak to its later low: "how bad did it hurt at the worst moment". With equal returns, a smaller drawdown is better.','La baisse entre un sommet et le creux suivant : « combien ça a fait mal au pire moment ». À rendement égal, un repli plus faible vaut mieux.']],
['volatility',['波动率','Volatility','Volatilité'],['收益上下起伏的幅度（这里用日收益的标准差）。波动越大，结果越不稳定，也越容易被运气左右。','How much returns swing up and down (here the standard deviation of daily returns). Higher volatility means less stable results and more influence from luck.','L\'amplitude des variations de rendement (ici l\'écart-type des rendements quotidiens). Plus elle est élevée, moins les résultats sont stables et plus la chance pèse.']],
['stop',['止损 / 回撤止盈','Stop-loss / trailing stop','Stop-loss / stop suiveur'],['事先定好的“认错线”：亏到一定比例就卖出，防止小亏变大亏。回撤止盈则是盈利后，从最高点回落一定比例就卖出，保住大部分利润。','A pre-set "admit I was wrong" line: sell once the loss reaches a set size so small losses do not become big ones. A trailing stop sells once price falls a set percentage from its peak, locking in most of the gain.','Une ligne « j\'admets mon erreur » fixée à l\'avance : on vend dès que la perte atteint un seuil. Un stop suiveur vend quand le prix recule d\'un pourcentage depuis son sommet, pour garder l\'essentiel du gain.']],
['slippage',['滑点','Slippage','Glissement (slippage)'],['你看到的价格和实际成交价之间的差。真实交易中，价差和成交速度都会造成它。本项目每边按 0.05% 模拟，所以“决策价”和“成交价”总是略有不同。','The gap between the price you saw and the price you actually got, caused by the bid-ask spread and execution speed. Here it is 0.05% per side, so the "decision price" and "fill price" always differ slightly.','L\'écart entre le prix vu et le prix obtenu, dû à la fourchette et à la vitesse d\'exécution. Ici 0,05 % par côté, donc le « prix de décision » et le « prix d\'exécution » diffèrent toujours un peu.']],
['t1',['T+1 交收','T+1 settlement','Règlement T+1'],['卖出股票后，资金要到下一个交易日才真正到账可用。现金账户只能用已到账的钱买入，这也限制了日内交易的频率。','After selling, the cash only becomes usable on the next trading day. A cash account can only buy with settled money, which also limits how often you can day-trade.','Après une vente, l\'argent n\'est utilisable que le jour de bourse suivant. Un compte comptant n\'achète qu\'avec de l\'argent réglé, ce qui limite aussi le day trading.']],
['pdt',['PDT 规则','Pattern Day Trader (PDT) rule','Règle PDT'],['美国规定：保证金账户低于 25,000 美元时，5 个交易日内最多做 3 次日内买卖（当天买入当天卖出）。本项目按“现金账户”模拟，因此不受此限制；如果你用保证金账户，日内交易的结果会不同。','A US rule: margin accounts under $25,000 may make at most 3 day trades (buy and sell the same day) in 5 business days. This project simulates a cash account, so it is not affected; with a margin account results for intraday trading would differ.','Règle américaine : un compte sur marge de moins de 25 000 $ ne peut faire que 3 day trades (achat et vente le même jour) sur 5 jours ouvrés. Ce projet simule un compte comptant, donc non concerné ; avec un compte sur marge, les résultats intrajour seraient différents.']],
['fractional',['碎股','Fractional shares','Actions fractionnées'],['可以只买一股的一部分，比如花 $500 买 0.6 股。这让小资金也能买价格很高的股票，并且收益率与本金大小几乎无关。','Buying part of one share, e.g. $500 buys 0.6 shares. It lets small accounts own expensive stocks, and makes the percentage return nearly independent of account size.','Acheter une fraction d\'action, p. ex. 500 $ pour 0,6 action. Cela permet aux petits comptes de détenir des actions chères et rend le rendement en % quasi indépendant de la taille du compte.']],
['benchmark',['基准 / 买入持有','Benchmark / buy & hold','Référence / acheter et conserver'],['用来比较的“最简单做法”。如果复杂的交易还不如直接买入 SPY 然后不动，那折腾就没有价值。本项目的基准是 SPY 买入持有、21 只等权持有，以及随机决策。','The "simplest alternative" you compare against. If elaborate trading cannot beat simply buying SPY and doing nothing, the effort has no value. The benchmarks here: SPY buy & hold, 21-stock equal-weight, and random decisions.','L\'« alternative la plus simple » à battre. Si un trading élaboré ne fait pas mieux qu\'acheter SPY et ne rien faire, il n\'a pas de valeur. Références ici : SPY, équipondéré 21 actions, et décisions aléatoires.']],
['survivorship',['幸存者偏差','Survivorship bias','Biais du survivant'],['我们的 21 只股票都是如今的明星股，而不是随机抽的。只看它们会高估“买股票”的效果，所以必须和“等权持有”对比。','Our 21 stocks are today\'s well-known winners, not a random draw. Looking only at them overstates how well "owning stocks" works, which is why we compare with the equal-weight benchmark.','Nos 21 actions sont les vedettes d\'aujourd\'hui, pas un tirage aléatoire. Les regarder seules surestime l\'effet de « détenir des actions » ; d\'où la comparaison avec l\'équipondéré.']],
['lookahead',['前视偏差（为何不能回测 AI）','Look-ahead bias (why we cannot backtest the AI)','Biais d\'anticipation (pourquoi on ne peut pas backtester l\'IA)'],['AI 模型的训练数据里已经包含了过去发生的事。让它“预测”历史，等于让它抄答案，结果会虚高。所以只能向前实测，让它面对真正未知的未来。','An AI model was trained on data that already includes the past. Asking it to "predict" history is like letting it copy the answers, so results look too good. Only forward testing, facing a truly unknown future, is credible.','Un modèle d\'IA a été entraîné sur des données qui contiennent déjà le passé. Lui faire « prédire » l\'histoire revient à copier les réponses. Seul le test en temps réel face à un futur inconnu est crédible.']],
['samplesize',['样本量与运气','Sample size and luck','Taille d\'échantillon et chance'],['几天的结果大多是运气。统计上要看几十到上百次独立决策才能区分“有能力”和“碰巧”。所以耐心观察比急着下结论更重要。','A few days of results are mostly luck. You need dozens to hundreds of independent decisions to tell skill from chance. Patience matters more than quick conclusions.','Quelques jours de résultats relèvent surtout de la chance. Il faut des dizaines à des centaines de décisions indépendantes pour distinguer compétence et hasard. La patience compte plus que les conclusions rapides.']],
['winrate',['胜率与盈亏比','Win rate and payoff ratio','Taux de réussite et ratio gain/perte'],['胜率是赚钱交易占比；盈亏比是平均盈利除以平均亏损。胜率 40% 但赚得多亏得少，也能整体盈利；胜率 80% 但一次大亏就吃掉所有盈利也很常见。','Win rate is the share of profitable trades; payoff ratio is average win ÷ average loss. A 40% win rate can still profit if wins are big and losses small; an 80% win rate can lose money if one large loss wipes out the gains.','Le taux de réussite est la part de trades gagnants ; le ratio gain/perte est le gain moyen ÷ la perte moyenne. 40 % de réussite peut rapporter si les gains sont gros et les pertes petites ; 80 % peut perdre si une seule grosse perte efface tout.']],
['turnover',['换手率与交易成本','Turnover and trading costs','Rotation et coûts de transaction'],['交易越频繁，滑点和费用累积得越多，每一笔都要“多赚一点”才能抵消。比较“频繁交易”和“长期持有”时，一定要看扣掉成本后的结果。','The more you trade, the more slippage and fees add up, so each trade must earn a bit more to break even. Compare frequent trading with patient holding only after costs.','Plus on trade, plus le glissement et les frais s\'accumulent ; chaque opération doit rapporter un peu plus pour s\'équilibrer. Comparez trading fréquent et détention patiente après coûts.']],
['fees',['SEC 费与 FINRA TAF','SEC fee and FINRA TAF','Frais SEC et FINRA TAF'],['美国券商零佣金，但卖出时仍要付两笔监管费：SEC 费（约每百万美元 20.60 美元）和 FINRA 交易活动费（每股 $0.000195，单笔 $0.01–$9.79）。对小账户很少，但长期累计不为零。','US brokers charge no commission, but sells still carry two regulatory fees: the SEC fee (about $20.60 per $1M) and the FINRA TAF ($0.000195 per share, $0.01–$9.79 per trade). Tiny for small accounts, but not zero over time.','Les courtiers américains n\'ont pas de commission, mais les ventes supportent deux frais réglementaires : frais SEC (≈ 20,60 $ par million) et FINRA TAF (0,000195 $ par action, 0,01–9,79 $ par ordre). Minimes pour un petit compte, mais pas nuls à la longue.']],
['regime',['牛市过滤（200 日均线）','Bull-market filter (200-day average)','Filtre haussier (moyenne 200 jours)'],['只在大盘（SPY）站上 200 日均线时才开新仓。思路是：大盘走弱时，个股趋势策略更容易失效，不如先观望。','Only open new positions while the market (SPY) is above its 200-day average. Idea: when the market is weak, stock trend strategies fail more often, so wait.','N\'ouvrir de nouvelles positions que si le marché (SPY) est au-dessus de sa moyenne 200 jours. Idée : quand le marché est faible, les stratégies de tendance échouent plus souvent ; mieux vaut attendre.']],
['relstrength',['相对大盘表现','Relative performance vs the market','Performance relative au marché'],['一只股票涨 5% 听起来不错，但如果大盘同期涨 8%，它其实是跑输。判断选股能力要看“相对大盘”，而不是只看涨跌。','A stock up 5% sounds good, but if the market rose 8% it actually lagged. Judge stock picking by performance relative to the market, not by raw gains.','Une action en hausse de 5 % semble bonne, mais si le marché a gagné 8 %, elle a en fait sous-performé. Jugez le choix d\'actions par rapport au marché, pas aux gains bruts.']],
['calibration',['信心校准','Confidence calibration','Calibration de la confiance'],['如果 AI 说“有 80% 把握”的判断，长期只有一半是对的，说明它过度自信。好的判断者，说多有把握就应该有多准。','If an AI says "80% sure" and is right only half the time, it is overconfident. A good forecaster is right about as often as the confidence it states.','Si une IA dit « sûre à 80 % » et n\'a raison qu\'une fois sur deux, elle est trop confiante. Un bon prévisionniste a raison aussi souvent que la confiance qu\'il affiche.']]];

function glEx(id){
  const A=Object.values(S.accounts),ms=Object.entries(S.market||{});
  try{
  if(id==='sma'){const m=M('SPY');return m.price?t('ex.sma',{p:usd(m.price),s:usd(m.sma50),rel:m.price>m.sma50?t('ex.up'):t('ex.dn')}):''}
  if(id==='rsi'&&ms.length){const s=[...ms].sort((a,b)=>b[1].rsi-a[1].rsi);return t('ex.rsi',{a:s[0][0],ra:s[0][1].rsi,b:s.at(-1)[0],rb:s.at(-1)[1].rsi})}
  if(id==='momentum'&&ms.length){const s=[...ms].sort((a,b)=>b[1].mom60-a[1].mom60);return t('ex.mom',{a:s[0][0],ra:pct(s[0][1].mom60),b:s.at(-1)[0],rb:pct(s.at(-1)[1].mom60)})}
  if(id==='drawdown'){const w=Object.keys(S.accounts).map(i=>[i,maxdd(S.accounts[i])]).sort((a,b)=>a[1]-b[1])[0];return t('ex.dd',{a:nm(w[0]),d:pct(w[1])})}
  if(id==='slippage'){let best=null;TRADERS.forEach(i=>{const a=S.accounts[i];if(!a)return;const x=[...a.trades].reverse().find(y=>y.detail&&y.detail.decision_price);if(x&&(!best||x.time>best.x.time))best={i,x}});
    return best?t('ex.slip',{a:nm(best.i),s:best.x.side==='BUY'?t('side.buy'):t('side.sell'),p1:usd(best.x.detail.decision_price),p2:usd(best.x.price),x:pct(best.x.price/best.x.detail.decision_price-1)}):''}
  if(id==='t1')return t('ex.t1',{v:usd(A.reduce((s,a)=>s+a.unsettled.reduce((q,u)=>q+u.amount,0),0))});
  if(id==='benchmark'){const b=[...TRADERS].filter(i=>S.accounts[i]).sort((x,y)=>ret(S.accounts[y])-ret(S.accounts[x]))[0];return t('ex.bench',{a:pct(ret(S.accounts.spy)),b:pct(ret(S.accounts.equal)),n:nm(b),c:pct(ret(S.accounts[b]))})}
  if(id==='samplesize')return t('ex.sample',{d:tradingDays()});
  if(id==='fees')return t('ex.fees',{v:usd(A.reduce((s,a)=>s+(a.fees_paid||0),0))});
  if(id==='regime'){const m=M('SPY');return m.price&&m.sma200?t('ex.regime',{p:usd(m.price),rel:m.price>m.sma200?t('ex.up'):t('ex.dn'),m:usd(m.sma200),res:m.price>m.sma200?t('cd.allow'):t('cd.block')}):''}
  }catch(e){}
  return ''}

function excess(e,n){const ks=dcKeys(),later=ks.filter(k=>k>e.date);if(later.length<n)return null;const k=later[n-1],dc=S.daily_close,base=dc[e.date]&&dc[e.date].SPY,now=dc[k].SPY;const r=n===1?e.r1:e.r5;
  return r==null||!base||!now?null:r-(now/base-1)}
function newsTab(){

  if(!done.length){$('lbody').innerHTML=`<div class="card"><h2>${t('ns.title')}</h2><div class="sm mut">${t('ns.sub')}</div><div class="empty">${t('ns.empty')}</div><div class="sm mut" style="text-align:center">${N.length?t('ns.pend')+': '+N.length:''}</div></div>`;return}
  const group=(keyf,label)=>{const g={};done.forEach(e=>{(g[keyf(e)]=g[keyf(e)]||[]).push(e)});
    return Object.entries(g).sort((a,b)=>b[1].length-a[1].length).map(([k,es])=>{const x1=es.map(e=>excess(e,1)).filter(v=>v!=null),x5=es.map(e=>excess(e,5)).filter(v=>v!=null),dir=es.filter(e=>e.sent!==0);
      return `<tr><td>${label(k)}</td><td>${es.length}</td><td class="${cls(avg(es.map(e=>e.r1)))}">${pct(avg(es.map(e=>e.r1)))}</td><td class="${cls(avg(x1)||0)}">${pct(avg(x1))}</td><td class="${cls(avg(x5)||0)}">${pct(avg(x5))}</td><td>${dir.length?pct0(dir.filter(e=>(e.sent>0)===(e.r1>0)).length/dir.length):'—'}</td></tr>`}).join('')};
  const head=`<tr><th>${t('ns.type')}</th><th>${t('ns.n')}</th><th>${t('ns.r1')}</th><th>${t('ns.r1x')}</th><th>${t('ns.r5x')}</th><th>${t('ns.hit')}</th></tr>`;

  $('lbody').innerHTML=`<div class="banner info">${t('lh.warn')}<br>${t('ns.caution')}</div><div class="card"><h2>${t('ns.title')}</h2><div class="sm mut" style="margin-bottom:8px">${t('ns.sub')} (${done.length}/${N.length})</div>
   <h3>${t('ns.bytype')}</h3><div class="scroll"><table class="mx">${head}${group(e=>e.type,k=>t('ty.'+k))}</table></div>
   <h3>${t('ns.bysent')}</h3><div class="scroll"><table class="mx">${head}${group(e=>String(e.sent),k=>t('sent.'+k))}</table></div>
   <h3>${t('ns.byimp')}</h3><div class="scroll"><table class="mx">${head}${group(e=>String(e.imp),k=>t('imp.'+k))}</table></div></div>
   <div class="card"><h2>${t('ns.recent')}</h2><div class="scroll"><table><tr><th style="text-align:left">${t('mw.sym')}</th><th>${t('ns.type')}</th><th>${t('ns.bysent')}</th><th>${t('ns.byimp')}</th><th>${t('ns.r1')}</th></tr>${recent}</table></div></div>`}
function sigHit(s){return s.action==='BUY'?s.r1>0:s.r1<0}
function sigFav(s){return s.action==='BUY'?s.r1:-s.r1}
function calibTab(){
  const all=(S.signals||[]),sg=all.filter(s=>s.r1!=null);
  if(!sg.length){$('lbody').innerHTML=`<div class="card"><h2>${t('cb.title')}</h2><div class="sm mut">${t('cb.sub')}</div><div class="empty">${t('cb.empty')} (${all.length})</div></div>`;return}
  const row=(label,es)=>{const h=es.length?es.filter(sigHit).length/es.length:null;return `<tr><td>${label}</td><td>${es.length}</td><td><div style="display:flex;align-items:center;gap:6px;justify-content:center"><div style="width:90px;height:8px;background:var(--line);border-radius:4px"><div style="width:${h==null?0:Math.round(h*100)}%;height:8px;background:${h>=0.5?'var(--up)':'var(--down)'};border-radius:4px"></div></div>${h==null?'—':pct0(h)}</div></td><td class="${es.length?cls(avg(es.map(sigFav))):''}">${es.length?pct(avg(es.map(sigFav))):'—'}</td></tr>`};
  const B=[[0,.5],[.5,.6],[.6,.7],[.7,.8],[.8,1.01]],head=`<tr><th>${''}</th><th>${t('cb.n')}</th><th>${t('cb.hit')}</th><th>${t('cb.avg')}</th></tr>`;
  $('lbody').innerHTML=`<div class="banner info">${t('lh.warn')}</div><div class="card"><h2>${t('cb.title')}</h2><div class="sm mut">${t('cb.sub')}</div><div class="sm mut" style="margin:4px 0 8px">${t('cb.note')}</div>
   <div class="scroll"><table class="mx">${head.replace('<th></th>',`<th>${t('cb.bucket')}</th>`)}${B.map(([a,b])=>row(`${Math.round(a*100)}–${Math.min(100,Math.round(b*100))}%`,sg.filter(s=>s.conf>=a&&s.conf<b))).join('')}${row('<b>'+t('cb.all')+'</b>',sg)}</table></div></div>
   <div class="two eq"><div class="card"><h2>${t('cb.byacct')}</h2><table class="mx">${head.replace('<th></th>','<th></th>')}${['ai_long','ai_short','ai_aggr','ai_hedge'].filter(i=>S.accounts[i]).map(i=>row(nm(i),sg.filter(s=>s.acct===i))).join('')}</table>
   <h3>${t('cb.byact')}</h3><table class="mx">${head}${row(t('cb.buy'),sg.filter(s=>s.action==='BUY'))}${row(t('cb.sell'),sg.filter(s=>s.action==='SELL'))}</table></div>
   <div class="card"><h2>${t('cb.byapp')}</h2><table class="mx">${head}${row(t('cb.allowed'),sg.filter(s=>s.applied))}${row(t('cb.rejected'),sg.filter(s=>!s.applied))}</table><div class="sm mut" style="margin-top:8px">${t('cb.rej.note')}</div></div></div>`}
const PK='sim_picks_v1';
function loadPicks(){try{return JSON.parse(store.get(PK)||'{}')}catch(e){return{}}}
function challengeTab(){
  const today=etDate(S.updated),picks=loadPicks(),cur=picks[today]||{},dc=S.daily_close||{},ks=dcKeys();
  const hist=[];Object.entries(picks).forEach(([d,m])=>Object.entries(m).forEach(([sym,p])=>{const nx=ks.find(k=>k>d);const r=nx&&dc[nx][sym]&&p.px?dc[nx][sym]/p.px-1:null;hist.push({d,sym,dir:p.dir,px:p.px,r,ok:r==null?null:(p.dir==='up'?r>0:r<0)})}));
  hist.sort((a,b)=>b.d.localeCompare(a.d));const dn=hist.filter(h=>h.ok!=null),sg=(S.signals||[]).filter(s=>s.r1!=null&&s.action==='BUY');
  const sel=Object.keys(cur).length,syms=(S.universe||[]).filter(s=>M(s).price);
  $('lbody').innerHTML=`<div class="card"><h2>${t('ch.title')}</h2><div class="sm mut">${t('ch.sub')} ${t('ch.local')}</div>
   <h3>${t('ch.picks',{n:Math.max(0,5-sel)})}</h3><div class="scroll"><table><tr><th>${t('mw.sym')}</th><th>${t('mw.price')}</th><th>${t('mw.today')}</th><th style="text-align:center">${t('ch.up')} / ${t('ch.down')}</th></tr>${syms.map(s=>`<tr><td><b>${s}</b></td><td>${usd(M(s).price)}</td><td class="${cls(M(s).day)}">${pct(M(s).day)}</td><td style="text-align:center"><button class="tab ${cur[s]&&cur[s].dir==='up'?'on':''}" data-pk="${s}" data-dir="up" style="${cur[s]&&cur[s].dir==='up'?'background:var(--up);color:#fff;border-color:var(--up)':''}">${t('ch.up')}</button> <button class="tab" data-pk="${s}" data-dir="down" style="${cur[s]&&cur[s].dir==='down'?'background:var(--down);color:#fff;border-color:var(--down)':''}">${t('ch.down')}</button></td></tr>`).join('')}</table></div>
   <div style="margin-top:10px"><button class="tab" id="pksave" style="background:var(--acc);color:#fff;border-color:var(--acc)">${t('ch.save')}</button> <span id="pkmsg" class="sm mut"></span></div></div>
   <div class="card"><h2>${t('ch.score')}</h2><div class="grid" style="margin:0"><div class="card"><div class="k">${t('ch.you')}</div><div class="v">${dn.length?pct0(dn.filter(h=>h.ok).length/dn.length):'—'}</div><div class="sm mut">${dn.length} ${t('ch.res')}</div></div>
   <div class="card"><div class="k">${t('ch.ai')}</div><div class="v">${sg.length?pct0(sg.filter(sigHit).length/sg.length):'—'}</div><div class="sm mut">${sg.length} ${t('ch.res')}</div></div><div class="card"><div class="k">${t('ch.coin')}</div><div class="v">50%</div></div></div></div>
   <div class="card"><h2>${t('ch.hist')}</h2>${hist.length?`<div class="scroll"><table><tr><th>${t('tl.time')}</th><th>${t('mw.sym')}</th><th>${t('tl.act')}</th><th>${t('ch.base')}</th><th>${t('ch.out')}</th><th>${t('ch.res')}</th></tr>${hist.slice(0,60).map(h=>`<tr><td>${h.d}</td><td><b>${h.sym}</b></td><td class="${h.dir==='up'?'up':'down'}">${t(h.dir==='up'?'ch.up':'ch.down')}</td><td>${usd(h.px)}</td><td class="${h.r==null?'mut':cls(h.r)}">${h.r==null?t('ch.wait'):pct(h.r)}</td><td>${h.ok==null?'⏳':h.ok?'✅':'❌'}</td></tr>`).join('')}</table></div>`:`<div class="empty">${t('ch.none')}</div>`}</div>`;
  const draft={...cur};
  $('lbody').querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{const s=b.dataset.pk,d=b.dataset.dir;if(draft[s]&&draft[s].dir===d)delete draft[s];else{if(!draft[s]&&Object.keys(draft).length>=5)return;draft[s]={dir:d,px:draft[s]?.px||px(s)}}
    $('lbody').querySelectorAll(`[data-pk="${s}"]`).forEach(x=>{const on=draft[s]&&draft[s].dir===x.dataset.dir;x.style.background=on?(x.dataset.dir==='up'?'var(--up)':'var(--down)'):'';x.style.color=on?'#fff':'';x.style.borderColor=on?'transparent':''})});
  $('pksave').onclick=()=>{const all=loadPicks();all[today]=draft;store.set(PK,JSON.stringify(all));$('pkmsg').textContent=t('ch.saved')+' ✓'}}
function glossaryTab(term){
  const draw=q=>{q=(q||'').toLowerCase();const L=LIDX[LANG];
    const list=GL.filter(g=>!q||g[1][L].toLowerCase().includes(q)||g[2][L].toLowerCase().includes(q));
    $('glist').innerHTML=list.length?list.map(g=>{const ex=glEx(g[0]);return `<div class="card" id="g-${g[0]}" style="${term===g[0]?'outline:2px solid var(--acc)':''}"><h2>${g[1][L]}</h2><div>${g[2][L]}</div>${ex?`<div class="banner info" style="margin:10px 0 0"><b>${t('ln.ex')}：</b>${ex}</div>`:''}</div>`}).join(''):`<div class="empty">${t('ln.none')}</div>`};
  $('lbody').innerHTML=`<div class="sm mut" style="margin-bottom:8px">${t('ln.sub')} ${t('ln.note')}</div><input id="gq" placeholder="${t('ln.search')}" style="width:100%;max-width:360px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;margin-bottom:12px"><div id="glist"></div>`;
  draw('');$('gq').oninput=e=>draw(e.target.value);
  if(term){const el=$('g-'+term);if(el)el.scrollIntoView()}}

/* ============================ router ============================ */
function bindGo(){$('page').querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{location.hash='#/'+el.dataset.go})}
let ROUTE='overview',SUB=[];
function route(){if(!S)return;killCharts();logN=40;const parts=(location.hash.replace('#/','')||'overview').split('/'),r=parts[0];SUB=parts.slice(1);ROUTE=(S.accounts[r]||r==='compare'||r==='learn'||r==='news')?r:'overview';render();if(!SUB.length)window.scrollTo(0,0)}
function render(){killCharts();nav(ROUTE);ROUTE==='overview'?overview():ROUTE==='compare'?comparePage():ROUTE==='learn'?learnHub(SUB):ROUTE==='news'?newsPage():traderPage(ROUTE)}
function fullRender(){header();settingsUI();marketStrip();banners();render()}
$('dx').onclick=()=>$('dlg').close();$('dlg').onclick=e=>{if(e.target===$('dlg'))$('dlg').close()};
window.onhashchange=route;
applyTheme();mkTF();$('ttl').textContent=t('title');$('upd').textContent=t('loading');settingsUI();
/* ---- live refresh: poll for new data (and for a new version of this page) ---- */
const POLL_MS=(+new URLSearchParams(location.search).get('poll')||30)*1000;
let LAST_TXT='',PAGE_TAG=null,POLLING=false,TOAST_T=null;
async function pageTag(){try{const r=await fetch(location.pathname+'?v='+Date.now(),{method:'HEAD',cache:'no-store'});return r.headers.get('etag')||r.headers.get('last-modified')}catch(e){return null}}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('on');clearTimeout(TOAST_T);TOAST_T=setTimeout(()=>el.classList.remove('on'),2800)}
function canRerender(){const a=document.activeElement;
  const editing=ROUTE==='learn'&&SUB.length&&!['journal','news','calibration'].includes(SUB[0]);          // glossary search / prediction picks: do not wipe what the user is typing
  return !$('dlg').open&&!editing&&!(a&&['INPUT','TEXTAREA'].includes(a.tagName))}
async function poll(){
  if(POLLING||document.hidden||!S)return;POLLING=true;
  try{
    const r=await fetch('data/state.json?'+Date.now(),{cache:'no-store'});
    LAST_CHECK=new Date();tickerSet(infoItems());
    if(r.ok){const txt=await r.text();
      if(txt!==LAST_TXT){LAST_TXT=txt;S=JSON.parse(txt);header();marketStrip();banners();
        if(canRerender()){const y=window.scrollY;render();window.scrollTo(0,y)}else nav(ROUTE);
        toast(t('rf.updated'))}}
    const tag=await pageTag();
    if(PAGE_TAG&&tag&&tag!==PAGE_TAG){toast(t('rf.reload'));setTimeout(()=>location.reload(),900)}
  }catch(e){}
  POLLING=false}
setInterval(poll,POLL_MS);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
pageTag().then(x=>{PAGE_TAG=x});
window.__loadedAt=Date.now();
fetch('data/state.json?'+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(txt=>{LAST_TXT=txt;S=JSON.parse(txt);fullRender();route()}).catch(e=>{$('upd').textContent=t('load.fail')+e});
</script>
