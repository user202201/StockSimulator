<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Simulator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1a1d21;--mut:#6b7280;--line:#e5e7eb;--up:#0a8f4d;--down:#d33a2c;--acc:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--fg:#e6e8eb;--mut:#8b95a3;--line:#262c36;--up:#3ccf80;--down:#ff6b5e;--acc:#6ea0ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 2px}h2{font-size:14px;margin:0 0 10px;color:var(--mut);font-weight:600}
.sub{color:var(--mut);font-size:12px;margin-bottom:12px}
.banner{background:#fff3cd;color:#664d03;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.grid .card{margin:0}.k{color:var(--mut);font-size:12px}.v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500;font-size:12px}
.scroll{overflow-x:auto}.chart{position:relative;height:280px}
td.r{text-align:left;white-space:normal;color:var(--mut);font-size:12px}
</style>
</head>
<body><main>
<h1>📈 美股模拟交易</h1>
<div class="sub" id="upd">加载中…</div>
<div id="banner"></div>
<div class="grid" id="stats"></div>
<div class="card"><h2>净值曲线（对比 SPY 买入持有，起点归一为初始资金）</h2><div class="chart"><canvas id="ch"></canvas></div></div>
<div class="card"><h2>当前持仓</h2><div class="scroll"><table id="pos"></table></div></div>
<div class="card"><h2>最近成交</h2><div class="scroll"><table id="tr"></table></div></div>
</main>
<script>
const $=id=>document.getElementById(id);
const usd=x=>(x<0?'-':'')+'$'+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=x=>(x>=0?'+':'')+(x*100).toFixed(2)+'%';
const cls=x=>x>=0?'up':'down';
fetch('data/state.json?'+Date.now()).then(r=>r.json()).then(s=>{
  const eq=s.equity.length?s.equity[s.equity.length-1].equity:s.initial_cash;
  const pnl=eq-s.initial_cash, sells=s.trades.filter(t=>t.side==='SELL');
  const wins=sells.filter(t=>t.pnl>0).length;
  $('upd').textContent='最后更新：'+(s.updated?new Date(s.updated).toLocaleString():'尚未运行');
  if(s.demo)$('banner').innerHTML='<div class="banner">⚠️ 当前为<b>离线演示数据</b>（随机生成的价格），GitHub Actions 首次真实运行后会自动替换。</div>';
  const b0=s.equity[0]?.bench, b1=s.equity.at(-1)?.bench, bret=b0?b1/b0-1:0;
  const cards=[['总资产',usd(eq),''],['总盈亏',usd(pnl)+' ('+pct(pnl/s.initial_cash)+')',cls(pnl)],
    ['现金',usd(s.cash),''],['SPY 同期',pct(bret),cls(bret)],
    ['已平仓胜率',sells.length?Math.round(wins/sells.length*100)+'% ('+wins+'/'+sells.length+')':'—','']];
  $('stats').innerHTML=cards.map(([k,v,c])=>`<div class="card"><div class="k">${k}</div><div class="v ${c}" style="${k==='总资产'?'':'font-size:17px'}">${v}</div></div>`).join('');
  const rows=Object.entries(s.positions).map(([sym,p])=>{const px=s.prices[sym]??p.avg_cost,v=p.shares*px,u=v-p.shares*p.avg_cost;
    return `<tr><td><b>${sym}</b></td><td>${p.shares}</td><td>${usd(p.avg_cost)}</td><td>${usd(px)}</td><td>${usd(v)}</td><td class="${cls(u)}">${usd(u)} (${pct(px/p.avg_cost-1)})</td></tr>`});
  $('pos').innerHTML='<tr><th>代码</th><th>股数</th><th>成本</th><th>现价</th><th>市值</th><th>浮动盈亏</th></tr>'+(rows.join('')||'<tr><td colspan=6 style="text-align:center;color:var(--mut)">空仓</td></tr>');
  $('tr').innerHTML='<tr><th>时间</th><th>方向</th><th>代码</th><th>股数</th><th>价格</th><th>盈亏</th><th>原因</th></tr>'+
    s.trades.slice(-30).reverse().map(t=>`<tr><td>${t.time.slice(0,16).replace('T',' ')}</td><td class="${t.side==='BUY'?'up':'down'}">${t.side}</td><td>${t.symbol}</td><td>${t.shares}</td><td>${usd(t.price)}</td><td class="${t.pnl==null?'':cls(t.pnl)}">${t.pnl==null?'—':usd(t.pnl)}</td><td class="r">${t.reason}</td></tr>`).join('');
  try{
  const lab=s.equity.map(e=>e.time.slice(5,16).replace('T',' ')), base=s.equity[0]?.bench||1;
  new Chart($('ch'),{type:'line',data:{labels:lab,datasets:[
    {label:'策略',data:s.equity.map(e=>e.equity),borderColor:getComputedStyle(document.body).getPropertyValue('--acc')||'#2563eb',borderWidth:2,pointRadius:0,tension:.15},
    {label:'SPY',data:s.equity.map(e=>e.bench/base*s.initial_cash),borderColor:'#9ca3af',borderWidth:1.5,borderDash:[4,3],pointRadius:0}]},
    options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},scales:{x:{ticks:{maxTicksLimit:8}}}}});
  }catch(e){$('ch').parentNode.textContent='图表库加载失败（'+e.message+'）'}
}).catch(e=>{$('upd').textContent='加载失败：'+e});
</script>
</body></html>
